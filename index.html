function sheet(){const w=Object.values(LS.get("xyz_wb",{})).map(x=>x.q);app.innerHTML=`<div class="noprint"><button class="btn" onclick="print()">🖨 列印／存成 PDF</button><button class="btn g" onclick="home()">返回</button></div><h1>我的錯題卷</h1><p>班級＿＿　座號＿＿　姓名＿＿</p>`+w.map((q,i)=>`<div class="card"><div class="stem">${i+1}. ${q.s}</div>${q.o.map((t,j)=>`<div>（${"ABCD"[j]}）${hl(t)}</div>`).join("")}</div>`).join("")+`<h2 style="break-before:page">解答</h2>`+w.map((q,i)=>`<p>${i+1}. ${hl(q.a)}　${q.e}</p>`).join("")}
function start(qs,l){S={qs,l,i:0,ok:0,combo:0};ask()}
function ask(){const q=S.qs[S.i];if(!q)return end();
 app.innerHTML=`<div class="top"><span>${S.i+1}/${S.qs.length}</span><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><span>🔥${S.combo}　✅${S.ok}</span></div><div class="card"><div class="stem">${q.s}</div>${q.o.map((t,i)=>`<button class="o" data-i="${i}"><span>${"ABCD"[i]}</span><i style="font-style:normal">${hl(t)}</i></button>`).join("")}${q.h?`<button class="btn g" id="hn">💡 看部首線索</button> <span id="hv" style="color:var(--mu)"></span>`:""}<div class="ex" id="ex"></div><button class="btn" id="nx" hidden>下一題 ➜</button></div><button class="btn g" onclick="home()">離開</button>`;
 if($("#hn"))$("#hn").onclick=()=>{$("#hv").textContent=S.qs[S.i].h};
 app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const q=S.qs[S.i],t=q.o[+b.dataset.i],good=t===q.a;
  app.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(q.o[+x.dataset.i]===q.a)x.classList.add("ok")});
  const wb=LS.get("xyz_wb",{}),k=key(q);
  if(good){S.ok++;S.combo++;b.classList.add("pop");if(wb[k]){wb[k].n++;if(wb[k].n>=2)delete wb[k]}}else{b.classList.add("no");S.combo=0;wb[k]={q:{s:q.s,o:q.o,a:q.a,e:q.e},n:0}}
  LS.set("xyz_wb",wb);$("#ex").innerHTML=(good?"🎉 答對了！":"💡 再記一次：")+"<br>"+q.e;$("#ex").classList.add("on");$("#nx").hidden=false;$("#nx").onclick=()=>{S.i++;ask()}})}
function end(){const k=S.ok>=9?3:S.ok>=7?2:S.ok>=5?1:0;if(S.l){const st=LS.get("xyz_st",{});st[S.l]=Math.max(st[S.l]||0,k);LS.set("xyz_st",st)}
 app.innerHTML=`<div class="card" style="text-align:center"><h1>${stars(k)}</h1><div class="stem">答對 ${S.ok} / ${S.qs.length}</div><p>${k==3?"太強了！會考形音義穩穩拿分 🎉":k?"不錯喔，再玩一次衝三星！":"沒關係，答錯的已收進錯題本，複習後再挑戰！"}</p><button class="btn" onclick="home()">回首頁</button> <button class="btn g" id="ag">再玩一次</button></div>`;
 $("#ag").onclick=()=>S.l?start(gen(S.l),S.l):home()}
function proj(l){document.body.classList.add("big");let qs=gen(l),i=0,rev=0,tm=[0,0,0,0,0];
 const draw=()=>{const q=qs[i];app.innerHTML=`<div class="top"><b>${LV[l].e} ${LV[l].n}：${LV[l].t}</b><span>第 ${i+1} / ${qs.length} 題　［空白鍵／點畫面下方按鈕］</span><button class="btn g" id="x">離開</button></div><div class="card"><div class="stem">${q.s}</div>${q.o.map((t,j)=>`<div class="o ${rev&&t===q.a?"ok":""}"><span>${"ABCD"[j]}</span><i style="font-style:normal">${hl(t)}</i></div>`).join("")}<div class="ex ${rev?"on":""}">${q.e}</div></div><button class="btn" id="go">${rev?"下一題 ➜":"揭曉答案"}</button><div class="tm">${tm.map((v,j)=>`<div>第${j+1}組<b>${v}</b><button class="btn g" data-t="${j}">＋1</button><button class="btn g" data-m="${j}">－1</button></div>`).join("")}</div>`;
  $("#x").onclick=()=>{document.onkeydown=null;home()};$("#go").onclick=nx;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=e=>{e.stopPropagation();tm[+b.dataset.t]++;draw()});app.querySelectorAll("[data-m]").forEach(b=>b.onclick=e=>{e.stopPropagation();tm[+b.dataset.m]--;draw()})};
 const nx=()=>{if(!rev){rev=1}else{rev=0;i++;if(i>=qs.length){qs=gen(l);i=0}}draw()};
 document.onkeydown=e=>{if(e.code==="Space"||e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();nx()}};draw()}
home();
</script></body></html>
